[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sushiblas-cli"
version = "0.1.0"
description = "SushiBLAS developer CLI (build / test / run)"
authors = [{ name = "Mustafa Garip", email = "mustafagarip@sushisystems.io" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "sushicore==0.9.6",
    "typer>=0.12",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.3", "pyflakes>=3.0"]

[project.scripts]
sb = "sushiblas.cli:main"
sushiblas = "sushiblas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sushiblas*"]

[tool.setuptools.package-data]
sushiblas = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "small: one process and one thread, no network, no sleep, no file outside the build tree (60 s)",
    "medium: threads and processes, localhost, files in a temporary folder (300 s)",
    "large: real hardware, or a run longer than medium allows (900 s)",
    "quarantined: an intermittent test, out of every gating stage; see docs/reference/KNOWN_ISSUES.md",
]
