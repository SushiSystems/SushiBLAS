# SushiBLAS dependency fragment — the dependencies SushiBLAS owns on top of
# what SushiRuntime already provides. `hub` aggregates this with the SushiStack
# base fragment and (transitively) SushiRuntime's own fragment when SushiBLAS is
# part of the workspace, then provisions everything into the shared
# dependencies/ tree.
#
# SushiBLAS is orchestrated by SushiRuntime, so it needs every toolchain
# SushiRuntime needs. Rather than repeat those here, the [module] table below
# declares that dependency and `hub` folds the runtime's requirements into
# SushiBLAS's readiness picture.
#
# No port entries beyond that: today's build has no vcpkg.json manifest (classic
# vcpkg mode, developer-provisioned) and GTest is resolved the same way, so
# there is nothing new to declare here yet — matching sushiengine's fragment,
# which also declares no gtest port.
#
# Field reference:
#   description    Human-readable purpose (shown by `hub doctor`).
#   required       false => a missing one warns but does not stop the build.
#   linux_apt      apt package names; empty list = not an apt/vcpkg package.
#   windows_vcpkg  vcpkg port names; empty list = not an apt/vcpkg package.
#   check_cmd      Optional command; exit 0 means "already installed".

[module]
depends_on = ["sushiruntime", "sushilog", "sushiprofiler"]
# The CLI sushicore runs to build and package this library for a consumer: `sb build --lean`,
# then `sb package --no-archive`.
cli = "sb"

# SushiLog, the one logger of the process. SushiBLAS's log front includes its headers and links
# it directly; the CLI builds or reuses its package at this tag and hands its config folder to
# CMake.
[sushisystems.sushilog]
version = "v0.2.3"
commit  = "5f714a7bca6cad1a49e9a6133e75f0f791dba551"

# SushiProfiler, which the profile and profiling modules write zones, values and device spans to
# when SB_ENABLE_PROFILER is on. The CLI builds or reuses its package at this commit and hands
# its config folder to CMake. The v0.3.0 tag is cut after the SushiProfiler build, so the pin
# names the commit of main that build runs on.
[sushisystems.sushiprofiler]
version = "v0.3.0"
commit  = "c099165b5106f3004972c98e7adbc8f2f66329f3"
