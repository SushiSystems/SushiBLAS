# SushiBLAS CLI configuration.
#
# Layering (lowest -> highest precedence):
#   built-in defaults  ->  this file  ->  config.local.toml  ->  SB_* env vars
#
# This file is committed and holds shared / portable defaults. Machine-specific
# absolute paths (compiler locations, vcpkg, the runtime checkout) belong in a
# gitignored `config.local.toml` next to this file, using the SAME section
# layout. The active platform's `[tool.<platform>]` section is merged over the
# common `[tool]` section automatically.
#
# SushiBLAS consumes the shared SushiStack toolchain: when cxx / vcpkg_root are
# unset, the CLI resolves them from the workspace `dependencies/` tree, then from
# the machine tree under ~/.sushisystems, so a provisioned machine needs no local
# config at all.

[tool]
# target_bin, the executable `sb run` starts with no target, defaults to
# PROFILE.default_target in sushiblas/config.py. Set it here only to change it.
# The SushiRuntime sibling. Empty resolves to ../sushiruntime next to this repo.
sushiruntime_dir = ""

[tool.linux]
generator = "Ninja"
use_vcpkg = true
vcpkg_triplet = "x64-linux"

[tool.windows]
generator = "Ninja"
use_vcpkg = true
vcpkg_triplet = "x64-windows"
# The following are machine-specific; override in config.local.toml.
# vs_vcvars    = "C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvars64.bat"
# ninja_exe    = "C:/Program Files/Microsoft Visual Studio/2022/Community/Common7/IDE/CommonExtensions/Microsoft/CMake/Ninja/ninja.exe"
# cmake_exe    = "C:/Users/<you>/scoop/shims/cmake.exe"
# ctest_exe    = "C:/Users/<you>/scoop/shims/ctest.exe"
# vcpkg_root   = "C:/Projects/sushiruntime/dependencies/vcpkg"
# pkgconf_exe  = "C:/Projects/sushiruntime/dependencies/vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe"
# cxx          = "C:/Projects/sushiruntime/dependencies/toolchains/llvm-sycl/bin/clang++.exe"

[cli]
# CLI appearance, resolved by the shared `sushicore` package (same schema for
# sr/se/hub). Override in config.local.toml or with SUSHI_CLI_THEME /
# SUSHI_CLI_ICONS / SUSHI_CLI_COLOR — no rebuild needed. See sushicore's README
# for the full list of presets and the [cli.colors] / [cli.icon_overrides]
# tables for one-off overrides.
theme = "default"
icons = "text"
color = "auto"
