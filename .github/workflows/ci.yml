name: CI

# The pre-merge stage on every pull request; the post-merge stage, which adds ThreadSanitizer and
# SushiAI built against this commit, on every push to main and when nightly.yml calls this file.
# Every job runs the sb CLI, and each step is named after the command it runs. tests/README.md
# gives the sizes.
#
# SushiBLAS builds against a SushiRuntime checkout beside it (cmake/Runtime.cmake), so the build
# jobs check this repository out under sushiblas/ and SushiRuntime's main under sushiruntime/.
# On Linux the compiler is the oneAPI icpx that setup-oneapi installs; SB_CXX hands it to sb, and
# icx takes the C slot. On Windows `sb setup` provisions the intel/llvm toolchain.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      post_merge:
        description: Run the post-merge jobs as well.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # The OpenCL CPU JIT vectorizer crashes on one kernel; see docs/reference/KNOWN_ISSUES.md.
  CL_CONFIG_CPU_VECTORIZER_MODE: "1"

jobs:
  checks:
    name: Checkers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests

  cli:
    name: Python CLI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: ./sushiblas/.github/actions/setup-sb
      - name: python -m pyflakes sushiblas tests
        working-directory: sushiblas/cli
        run: python -m pyflakes sushiblas tests
      - name: sb test --cli
        working-directory: sushiblas
        run: sb test --cli

  linux:
    name: Linux (small, medium)
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
      - name: sb build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sb test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small
      - name: sb test --label medium
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label medium

  windows:
    name: Windows (small, medium)
    timeout-minutes: 90
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sushiblas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-sb
      - name: choco install ccache
        run: choco install ccache -y --no-progress
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-windows-intel-llvm-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
      - name: sb setup --yes --no-gpu
        run: sb setup --yes --no-gpu
      - name: sb build
        run: sb build
      - name: sb test --label small
        run: sb test --label small
      - name: sb test --label medium
        run: sb test --label medium

  sanitizers:
    name: ASan and UBSan (small)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-asan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
      # Release, because SushiRuntime turns ThreadSanitizer on for its own debug builds.
      - name: sb build --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sb test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small

  gate:
    name: gate
    if: always()
    needs: [checks, cli, linux, windows, sanitizers]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every pre-merge job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  thread-sanitizer:
    name: ThreadSanitizer (small, medium)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
      # The SYCL runtime, oneTBB and the OpenCL CPU device are not instrumented, so TSan would
      # report races inside their own thread pools; this keeps it to the code built here.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: ccache-linux-icpx-tsan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
      # RelWithDebInfo, so SushiRuntime instruments its own threads as well.
      - name: sb build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - name: sb test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small
      - name: sb test --label medium
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label medium

  downstream:
    name: SushiAI against this commit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 90
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiAI
          path: sushiai
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python -m pip install -e ./cli
        run: python -m pip install -e ./cli
      - name: sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
