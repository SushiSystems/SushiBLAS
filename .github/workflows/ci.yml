name: CI

# The pre-merge stage on every pull request; the post-merge stage, which adds ThreadSanitizer and
# SushiAI built against this commit, on every push to main and when nightly.yml calls this file.
# Every job runs the sb CLI, and each step is named after the command it runs. tests/README.md
# gives the sizes.
#
# SushiBLAS builds against a SushiRuntime checkout beside it (cmake/Runtime.cmake), so the build
# jobs check this repository out under sushiblas/ and SushiRuntime's main under sushiruntime/.
# On Linux the compiler is the oneAPI icpx that setup-oneapi installs; SB_CXX hands it to sb, and
# icx takes the C slot. On Windows `sb setup` provisions the intel/llvm toolchain.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      post_merge:
        description: Run the post-merge jobs as well.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  # sb setup downloads the Windows toolchain afresh on every run, so a cache keyed on the
  # compiler's mtime would never hit; its content is the same from run to run.
  CCACHE_COMPILERCHECK: content
  # sb test runs CTest serially unless told otherwise; the runners have four cores.
  CTEST_PARALLEL_LEVEL: "4"
  # The OpenCL CPU JIT vectorizer crashes on one kernel; see docs/reference/KNOWN_ISSUES.md.
  CL_CONFIG_CPU_VECTORIZER_MODE: "1"

jobs:
  checks:
    name: Checkers (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # The design and backlog checkers read their rules from sushicore, which the CLI pins.
      - name: python -m pip install ./cli
        run: python -m pip install ./cli
      - name: python tools/check_all.py .
        run: python tools/check_all.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests

  cli:
    name: Python CLI
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: ./sushiblas/.github/actions/setup-sb
      - name: python -m pyflakes sushiblas tests
        working-directory: sushiblas/cli
        run: python -m pyflakes sushiblas tests
      - name: sb test --cli
        working-directory: sushiblas
        run: sb test --cli

  linux:
    name: Linux (small, medium)
    timeout-minutes: 150
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiLog at the version cli/sushistack.deps.toml pins, as the sibling ../sushilog sb finds.
      - name: python -c "...pinned SushiLog version..."
        id: sushilog
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushilog']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiLog
          ref: ${{ steps.sushilog.outputs.version }}
          path: sushilog
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiProfiler at the version cli/sushistack.deps.toml pins, as the sibling ../sushiprofiler sb finds.
      - name: python -c "...pinned SushiProfiler version..."
        id: sushiprofiler
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushiprofiler']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiProfiler
          ref: ${{ steps.sushiprofiler.outputs.version }}
          path: sushiprofiler
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      # Restored and saved apart, so a run that fails or times out still keeps what it compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-icpx-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
            ccache-linux-icpx-release-
      - name: sb build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
      - name: sb test --label small
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small
      - name: sb test --label medium
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label medium

  windows:
    name: Windows (small, medium)
    timeout-minutes: 150
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sushiblas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiLog at the version cli/sushistack.deps.toml pins, as the sibling ../sushilog sb finds.
      - name: python -c "...pinned SushiLog version..."
        id: sushilog
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushilog']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiLog
          ref: ${{ steps.sushilog.outputs.version }}
          path: sushilog
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiProfiler at the version cli/sushistack.deps.toml pins, as the sibling ../sushiprofiler sb finds.
      - name: python -c "...pinned SushiProfiler version..."
        id: sushiprofiler
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushiprofiler']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiProfiler
          ref: ${{ steps.sushiprofiler.outputs.version }}
          path: sushiprofiler
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-sb
      - name: choco install ccache
        run: choco install ccache -y --no-progress
      # Restored and saved apart, so a run that fails or times out still keeps what it compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-intel-llvm-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
            ccache-windows-intel-llvm-release-
      # The SushiRuntime package is built by sr, which needs the vcpkg and Ninja sr setup records.
      - name: sr setup --yes --no-gpu
        working-directory: sushiruntime
        run: sr setup --yes --no-gpu
      - name: sb setup --yes --no-gpu
        run: sb setup --yes --no-gpu
      # sb setup installs the OpenCL ICD loader only; the tests need a SYCL device behind it.
      - uses: ./sushiblas/.github/actions/setup-opencl-cpu
      - name: sb build
        run: sb build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-windows-intel-llvm-release-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
      - name: sb test --label small
        run: sb test --label small
      - name: sb test --label medium
        run: sb test --label medium

  sanitizers:
    name: ASan and UBSan (small)
    timeout-minutes: 120
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiLog at the version cli/sushistack.deps.toml pins, as the sibling ../sushilog sb finds.
      - name: python -c "...pinned SushiLog version..."
        id: sushilog
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushilog']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiLog
          ref: ${{ steps.sushilog.outputs.version }}
          path: sushilog
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiProfiler at the version cli/sushistack.deps.toml pins, as the sibling ../sushiprofiler sb finds.
      - name: python -c "...pinned SushiProfiler version..."
        id: sushiprofiler
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushiprofiler']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiProfiler
          ref: ${{ steps.sushiprofiler.outputs.version }}
          path: sushiprofiler
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      # Restored and saved apart, so a run that fails or times out still keeps what it compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-icpx-asan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
            ccache-linux-icpx-asan-
      # Release, because SushiRuntime turns ThreadSanitizer on for its own debug builds.
      - name: sb build --type release --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build --type release --sanitize address-undefined -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-asan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
      - name: sb test --label small --type release --sanitize address-undefined
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small --type release --sanitize address-undefined

  gate:
    name: gate
    if: always()
    needs: [checks, cli, linux, windows, sanitizers]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every pre-merge job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  thread-sanitizer:
    name: ThreadSanitizer (small, medium)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 120
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiblas
    env:
      SB_CXX: icpx
      # The SYCL runtime, oneTBB and the OpenCL CPU device are not instrumented, so TSan would
      # report races inside their own thread pools; this keeps it to the code built here.
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiLog at the version cli/sushistack.deps.toml pins, as the sibling ../sushilog sb finds.
      - name: python -c "...pinned SushiLog version..."
        id: sushilog
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushilog']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiLog
          ref: ${{ steps.sushilog.outputs.version }}
          path: sushilog
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiProfiler at the version cli/sushistack.deps.toml pins, as the sibling ../sushiprofiler sb finds.
      - name: python -c "...pinned SushiProfiler version..."
        id: sushiprofiler
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushiprofiler']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiProfiler
          ref: ${{ steps.sushiprofiler.outputs.version }}
          path: sushiprofiler
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: ./sushiblas/.github/actions/setup-oneapi
      - uses: ./sushiblas/.github/actions/setup-sb
      # Restored and saved apart, so a run that fails or times out still keeps what it compiled.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-icpx-tsan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-
            ccache-linux-icpx-tsan-
      # RelWithDebInfo, so SushiRuntime instruments its own threads as well.
      - name: sb build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb build --type relwithdebinfo --sanitize thread -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .ccache
          key: ccache-linux-icpx-tsan-${{ hashFiles('sushiblas/**/CMakeLists.txt', 'sushiblas/cmake/**') }}-${{ github.sha }}
      - name: sb test --label small --type relwithdebinfo --sanitize thread
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label small --type relwithdebinfo --sanitize thread
      - name: sb test --label medium --type relwithdebinfo --sanitize thread
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sb test --label medium --type relwithdebinfo --sanitize thread

  downstream:
    name: SushiAI against this commit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.post_merge
    timeout-minutes: 150
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: sushiai
    env:
      SA_CXX: icpx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiLog at the version cli/sushistack.deps.toml pins, as the sibling ../sushilog sb finds.
      - name: python -c "...pinned SushiLog version..."
        id: sushilog
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushilog']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiLog
          ref: ${{ steps.sushilog.outputs.version }}
          path: sushilog
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiProfiler at the version cli/sushistack.deps.toml pins, as the sibling ../sushiprofiler sb finds.
      - name: python -c "...pinned SushiProfiler version..."
        id: sushiprofiler
        shell: bash
        working-directory: .
        run: echo "version=$($(command -v python3 || command -v python) -c "import tomllib; print(tomllib.load(open('sushiblas/cli/sushistack.deps.toml', 'rb'))['sushisystems']['sushiprofiler']['version'])")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiProfiler
          ref: ${{ steps.sushiprofiler.outputs.version }}
          path: sushiprofiler
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiAI
          path: sushiai
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}
      # SushiAI's own setup actions, so the packages its build needs are the ones it names.
      - uses: ./sushiai/.github/actions/setup-oneapi
      - uses: ./sushiai/.github/actions/setup-sa
      - name: sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
        run: source /opt/intel/oneapi/setvars.sh --force > /dev/null && sa build -D CMAKE_C_COMPILER=icx -D CMAKE_CXX_FLAGS=-fsycl
