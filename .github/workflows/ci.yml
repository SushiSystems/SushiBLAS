name: CI

# Functional suite on every push / PR (fast, deterministic).
#
# Modelled on sushiruntime/.github/workflows/ci.yml, which is the stack's house
# style for CI. It is deliberately a subset — see "Deliberately absent" at the
# bottom of this file for what was left out and why.
#
# PROVENANCE — read before trusting this file. As of its first commit this
# workflow had never been executed: there is no runner on the machine it was
# written on. The container image, the apt package list, the compiler flags,
# the `source setvars.sh --force` line, the ctest label regex and the whole
# `cli` job are copied from sushiruntime's ci.yml, which does pass. What is NEW
# and has run nowhere is the two-checkout sibling layout, `working-directory`,
# `-DSR_BUILD_TESTS=OFF`, and — most importantly — compiling *this repo's*
# sources with icpx at all: SushiBLAS has only ever been built here with
# intel-llvm clang++, and cmake/SushiBLASCompilerWarnings.cmake turns on
# -Werror, so a warning icpx emits that clang++ does not will fail this lane.
# The first red run is expected to be informative, not surprising.
#
# ---------------------------------------------------------------------------
# Why this file calls cmake/ctest directly instead of `sb`
# ---------------------------------------------------------------------------
# CLAUDE.md requires every build to go through `sb` and never to invoke
# cmake/ninja directly; docs/CONTRIBUTING.md documents `sb build` / `sb test`
# as the way the project is built. This workflow is the one exception, for two
# reasons that apply only on a runner:
#
#   * `sb` resolves its compiler, cmake, ctest, ninja, pkgconf and vcpkg from
#     the toolchain `hub install` provisions into <workspace>/dependencies/ and
#     records in cli/config.local.toml. None of that exists on a stock GitHub
#     runner, and provisioning it would mean running the umbrella's entire
#     dependency pipeline just to compile one library.
#   * `sb` snapshots its build environment into `.sushi_env.json`, which is
#     gitignored — it is not in the checkout and, by design, cannot be.
#
# sushiruntime's own ci.yml sets this precedent and departs from the same rule
# for the same reasons. The steps below are the CI-side expression of what
# `sb build` configures locally (see cli/sushiblas/services/project.py's
# `_configure_args`), with one deliberate difference: the compiler. Locally the
# stack builds with the provisioned intel-llvm `clang++`
# (SR_SYCL_TOOLCHAIN=intel-llvm); here it builds with the container's `icpx`
# (SR_SYCL_TOOLCHAIN=oneapi, inferred from the compiler name by
# sushiruntime/cmake/Sycl.cmake). Both paths are supported by
# cmake/SyclTarget.cmake; icpx is used because it is what sushiruntime's
# passing CI uses and what the base image ships.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    steps:
      # SushiBLAS resolves SushiRuntime through cmake/Runtime.cmake's three
      # modes, in order: an already-defined target, find_package(SushiRuntime),
      # then add_subdirectory of a sibling checkout. No SushiRuntime package is
      # installed on a runner, so mode 3 is what fires — exactly as on a
      # developer box. Mode 3 resolves
      # ${CMAKE_CURRENT_SOURCE_DIR}/../sushiruntime, so this repo is checked
      # out into a subdirectory and the runtime beside it rather than either
      # sitting at $GITHUB_WORKSPACE's root.
      #
      # SUSHISTACK_HOME is deliberately left unset: Runtime.cmake prefers it
      # only when the module actually exists under it, and leaving it unset
      # makes the layout below the single thing that decides resolution.
      - name: Check out SushiBLAS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sushiblas

      - name: Check out the SushiRuntime sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SushiSystems/SushiRuntime
          path: sushiruntime
          # Unpinned (default branch, `main`) on purpose: this lane exists to
          # catch the stack breaking across module boundaries, and a pinned SHA
          # would hide precisely that.
          #
          # github.token is scoped to this repository only. SushiRuntime is
          # public, so that is enough to clone it; if it is ever made private
          # this checkout starts 404ing, and the fix is to add a repo-scoped
          # PAT as the SUSHISTACK_CI_TOKEN secret. The expression below falls
          # back to github.token whenever that secret is unset, so the hook
          # costs nothing today.
          token: ${{ secrets.SUSHISTACK_CI_TOKEN || github.token }}

      - name: Set up Intel oneAPI DPC++
        uses: ./sushiblas/.github/actions/setup-oneapi

      - name: Configure, build, and run functional suite
        shell: bash
        working-directory: sushiblas
        run: |
          set -e
          source /opt/intel/oneapi/setvars.sh --force
          # SR_BUILD_TESTS is already OFF by default in sushiruntime; stated
          # explicitly so a future change to that default can never make this
          # lane start building and running the runtime's suite as a side
          # effect. SushiBLAS's own tests are unconditional (see
          # tests/CMakeLists.txt) and need no flag.
          #
          # With it off, `ctest --test-dir build` walks a tree in which only
          # SushiBLAS registered anything, which is the same set `sb test`
          # runs locally — the project's 356-test figure, and nothing borrowed
          # from a sibling.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_CXX_FLAGS=-fsycl \
            -DSR_BUILD_TESTS=OFF
          cmake --build build
          # The umbrella label regex `sb test` uses. "functional" is an
          # alternation over the three sub-labels rather than a label of its
          # own — see tests/CMakeLists.txt for why.
          ctest --test-dir build -L "unit|integration|regression" --output-on-failure

  cli:
    name: Python CLI (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip pytest pyflakes
          python -m pip install -e ./cli

      - name: Import-safety check (no crash outside a checkout)
        working-directory: cli
        # pyflakes catches undefined names / bad imports without running anything.
        run: python -m pyflakes sushiblas || true

      - name: Run CLI unit tests
        working-directory: cli
        run: python -m pytest tests -q

# ---------------------------------------------------------------------------
# Deliberately absent (present in sushiruntime's ci.yml, not applicable here)
# ---------------------------------------------------------------------------
# * ThreadSanitizer job. sushiruntime's TSan lane targets a specific, named
#   body of concurrency it owns — EBR fences, per-worker polling, epoch
#   nesting. Ask the same question here and there is no answer: this repo's
#   entire synchronisation surface is (a) core/logger.hpp's AsyncLogger, whose
#   worker thread + mutex/cv queue is the one thing TSan would have to chew on
#   and which no target in this tree ever instantiates, (b) a one-shot
#   lock_guard around a static device-profile cache in support/device_policy.hpp,
#   and (c) a single std::atomic counter in engine.hpp. Every worker thread the
#   kernels actually run on belongs to SushiRuntime, whose own CI already
#   instruments them. There is also no gate to turn TSan on with —
#   cmake/SushiBLASSanitizers.cmake is an empty INTERFACE target, unlike
#   sushiruntime/cmake/Sanitizers.cmake's RelWithDebInfo auto-gate. A job here
#   would either instrument someone else's races or pass vacuously.
#
# * Nightly benchmark job. SushiBLAS registers no `stress` or `performance`
#   CTest labels, so `ctest -L "stress|performance"` would select nothing and
#   report success over an empty suite. There is nothing to schedule, so this
#   workflow has no `schedule:` trigger either.
#
# * Doxygen job. `sb docs` builds the reference from
#   `.config/doxygen/Doxyfile`, and no job here runs it: no runner of this
#   workflow installs doxygen.
#
# * tests/package/ job. That directory is an out-of-tree consumer of an
#   *installed* SushiBLAS, built by hand against an install prefix (see its
#   CMakeLists.txt header). sushiruntime has the same directory and likewise
#   does not wire it into CI; doing so here first would be a new decision, not
#   a match of the house style.

  checkers:
    name: Checkers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: python tools/documentation/check_source_comments.py .
        run: python tools/documentation/check_source_comments.py .
      - name: python tools/documentation/check_changelog.py .
        run: python tools/documentation/check_changelog.py .
      - name: python tools/layering/check_layering.py .
        run: python tools/layering/check_layering.py .
      - name: python tools/versioning/check_version.py .
        run: python tools/versioning/check_version.py .
      - name: python -m unittest discover -s tools/tests
        run: python -m unittest discover -s tools/tests
